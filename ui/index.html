<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMM Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">DMM Viewer</span>
    <span id="demoBadge" class="badge demo" title="Simulated meters, no hardware" hidden>Demo</span>
    <span id="backend" class="muted small"></span>
  </div>

  <div class="picker">
    <select id="meterSelect" aria-label="Detected meters"><option>Scanning…</option></select>
    <button id="addBtn" class="primary" disabled>Add DMM</button>
    <button id="rescanBtn">Rescan</button>
    <input id="extraScan" type="text" spellcheck="false" autocomplete="off"
           placeholder="Also scan: COM3, GPIB 9…"
           title="Serial ports and extra addresses to check on Rescan. COM ports are only probed if listed here.">
  </div>

  <div class="tools">
    <button id="mathBtn" class="toggle" aria-pressed="true" title="Show or hide the math strip (A − B, A ÷ B, …). Needs two meters.">Math</button>
    <button id="logBtn" title="Write every reading to a CSV file">Start CSV log</button>
    <span id="logInfo" class="muted small"></span>
    <button id="logFolderBtn" class="ghost icon" title="Open the log folder">📁</button>
    <label class="theme-pick muted small">Theme
      <select id="themeSelect" aria-label="Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="vfd">VFD (34401A)</option>
      </select>
    </label>
  </div>
</header>

<div id="notice" class="notice" hidden></div>

<section id="math" class="math" hidden>
  <div class="math-head">
    <span class="math-label">Math</span>
    <select id="mathOp" aria-label="Operation"></select>
    <label class="ab">A <select id="mathA" aria-label="Meter A"></select></label>
    <label class="ab">B <select id="mathB" aria-label="Meter B"></select></label>
    <span class="math-value"><span id="mathNum">—</span> <span id="mathUnit" class="unit"></span></span>
    <span id="mathNote" class="muted small" title="Time between the two readings being combined"></span>
    <button id="mathGraphBtn" class="ghost icon graph-btn" aria-pressed="true" title="Hide graph">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 13 5 8l3 2.5L12 4l3 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="mathClose" class="ghost icon close" title="Hide math">✕</button>
  </div>
  <canvas id="mathChart" class="chart chart-sm"></canvas>
</section>

<main id="panels" class="panels"></main>

<div id="empty" class="empty">
  <p>No meters open.</p>
  <p class="muted">Pick a meter above and press <b>Add DMM</b>.</p>
</div>

<template id="panelTpl">
  <article class="panel">
    <div class="panel-head">
      <span class="dot" title=""></span>
      <div class="title">
        <div class="name"></div>
        <div class="sub muted small"></div>
      </div>
      <span class="badge term" title="Input terminals selected on the meter's front panel"></span>
      <button class="ghost icon graph-btn" aria-pressed="true" title="Hide graph">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 13 5 8l3 2.5L12 4l3 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ghost icon remove" title="Remove panel">✕</button>
    </div>

    <div class="readout">
      <span class="value">——</span><span class="unit"></span>
      <div class="annun" aria-hidden="true">
        <span data-a="rmt" title="Remote: the app is in control">Rmt</span>
        <span data-a="man" title="Manual range">Man</span>
        <span data-a="4w" title="4-wire resistance">4W</span>
        <span data-a="rear" title="Rear terminals selected">Rear</span>
        <span data-a="err" title="Error or warning">ERROR</span>
      </div>
    </div>
    <div class="message small"></div>

    <div class="controls">
      <label>Function <select class="func"></select></label>
      <label>Range <select class="range"></select></label>
      <label>Speed <select class="speed"></select></label>
    </div>

    <div class="stats">
      <div><span>Min</span><b class="s-min">—</b></div>
      <div><span>Max</span><b class="s-max">—</b></div>
      <div><span>Avg</span><b class="s-avg">—</b></div>
      <div><span>N</span><b class="s-n">0</b></div>
      <button class="ghost icon reset" title="Reset min / max / average">↺</button>
    </div>

    <div class="chart-wrap">
      <canvas class="chart"></canvas>
      <select class="window small" aria-label="Graph time span">
        <option value="30">30 s</option>
        <option value="120">2 min</option>
        <option value="600">10 min</option>
      </select>
    </div>

    <div class="actions">
      <button class="run">Pause</button>
      <button class="local" title="Hand the meter back to its front panel">Return to Local</button>
    </div>
  </article>
</template>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">Continue</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
